stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

# Receive traces via OTLP gRPC from the OTel Collector
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m
  trace_idle_period: 10s

# Compactor - Tempo 2.7.x schema uses compactor.compaction sub-key
compactor:
  compaction:
    block_retention: 24h

# Metrics generator: writes RED metrics back to Prometheus
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Enable span-metrics and service-graph processors
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
